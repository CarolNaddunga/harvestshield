services:
  portal:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - harvestshield-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 384m
    cpus: 1.0
    networks:
      - development
networks:
  development:
    internal: true
volumes:
  harvestshield-data:
