services:
  - type: web
    name: harvestshield
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: harvestshield-db
          property: connectionString
      - key: HARVESTSHIELD_SECURE_COOKIES
        value: "1"
      - key: HARVESTSHIELD_ADMIN_PASSWORD
        sync: false
      - key: HARVESTSHIELD_CLERK_PASSWORD
        sync: false

databases:
  - name: harvestshield-db
    plan: free
    region: oregon
    databaseName: harvestshield
    user: harvestshield
    postgresMajorVersion: "16"
    ipAllowList: []
