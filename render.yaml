services:
  - type: web
    name: harvestshield
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HARVESTSHIELD_SECURE_COOKIES
        value: "1"
      - key: HARVESTSHIELD_ADMIN_PASSWORD
        sync: false
      - key: HARVESTSHIELD_CLERK_PASSWORD
        sync: false

